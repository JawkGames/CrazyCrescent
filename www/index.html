const REKLAM=(function(){
  const ID={banner:'ca-app-pub-7983529419004158/4140166464',gecis:'ca-app-pub-7983529419004158/3254299313',
            odul:'ca-app-pub-7983529419004158/7541028686',acilis:'ca-app-pub-7983529419004158/9597501336'};
  const cap=window.Capacitor,yerli=!!(cap&&cap.isNativePlatform&&cap.isNativePlatform());
  const A=yerli&&cap.Plugins?cap.Plugins.AdMob:null;
  let hazir=false,gY=false,oY=false,aY=false,acik=false,arka=false,sonAcilis=0,odulFn=null,odulAldi=false;
  const gYukle=()=>{if(hazir)A.prepareInterstitial({adId:ID.gecis}).then(()=>{gY=true;}).catch(()=>{gY=false;});};
  const oYukle=()=>{if(hazir)A.prepareRewardVideoAd({adId:ID.odul}).then(()=>{oY=true;}).catch(()=>{oY=false;});};
  const aYukle=()=>{if(hazir)A.loadAppOpen({adId:ID.acilis}).then(()=>{aY=true;}).catch(()=>{aY=false;});};
  function odulBitti(ok){if(!odulFn)return;const f=odulFn;odulFn=null;acik=false;oYukle();f(ok);}
  function acilisGoster(){
    if(!hazir||acik||!aY||Date.now()-sonAcilis<30000)return;
    acik=true;aY=false;sonAcilis=Date.now();
    A.showAppOpen().catch(()=>{acik=false;aYukle();});
  }
  async function basla(bannerCb){
    if(!A)return;
    try{
      await A.initialize({});
      try{const b=await A.requestConsentInfo();if(b&&b.isConsentFormAvailable&&b.status==='REQUIRED')await A.showConsentForm();}catch(e){}
      hazir=true;
      A.addListener('interstitialAdDismissed',()=>{acik=false;gYukle();});
      A.addListener('interstitialAdFailedToShow',()=>{acik=false;gYukle();});
      A.addListener('onRewardedVideoAdReward',()=>{odulAldi=true;});
      A.addListener('onRewardedVideoAdDismissed',()=>{odulBitti(odulAldi);});
      A.addListener('onRewardedVideoAdFailedToShow',()=>{odulBitti(false);});
      A.addListener('appOpenAdClosed',()=>{acik=false;aYukle();});
      A.addListener('appOpenAdFailedToShow',()=>{acik=false;aYukle();});
      A.addListener('bannerAdSizeChanged',(sz)=>{if(sz&&sz.height>0&&bannerCb)bannerCb(Math.ceil(sz.height));});
      A.showBanner({adId:ID.banner,adSize:'ADAPTIVE_BANNER',position:'BOTTOM_CENTER',margin:0}).catch(()=>{});
      gYukle();oYukle();aYukle();
    }catch(e){hazir=false;}
  }
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){if(!acik)arka=true;return;}
    if(arka){arka=false;acilisGoster();}
  });
  return{
    yerli:yerli,basla:basla,
    gecis(){if(!hazir||acik)return;if(!gY){gYukle();return;}acik=true;gY=false;A.showInterstitial().catch(()=>{acik=false;gYukle();});},
    odul(cb){

      acik=true;oY=false;odulAldi=false;odulFn=cb;
      A.showRewardVideoAd().then(it=>{if(it)odulAldi=true;setTimeout(()=>odulBitti(odulAldi),600);}).catch(()=>odulBitti(false));
    }
  };
})();

function rng(a){a>>>=0;return function(){a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function star4(x,y,r,rot){for(let i=0;i<8;i++){const a=rot+i*PI/4,rr=i%2?r*.38:r,X=x+Math.cos(a)*rr,Y=y+Math.sin(a)*rr;if(i)g.lineTo(X,Y);else g.moveTo(X,Y);}g.closePath();}

/* ---------- bulut çizimi (önbellekli) ---------- */
function cloudSpr(name,w,hh,pal,seed,soft,res){
  const key=name+'|'+w+'|'+hh+'|'+seed+'|'+(soft?1:0);
  let s=sprC.get(key);if(s)return s;
  res=res||SPR;const pad=soft?8:24;
  const c=mkc((w+pad*2)*res,(hh+pad*2+8)*res),x=c.getContext('2d');
  x.scale(res,res);x.translate(pad+w/2,pad);
  const R=rng(seed*9973+w*31+7),P=[];
  const n=Math.max(3,Math.round(w/(hh*.72))),m=Math.max(2,n-1);
  for(let i=0;i<m;i++){const t=(i+.5)/m,r=hh*(.3+.1*R());P.push([-w/2+r+t*(w-2*r),hh-r-R()*3,r,0]);}
  for(let i=0;i<n;i++){const t=i/(n-1),e=Math.sin(t*PI),r=hh*(.3+.17*e+.08*R());P.push([-w/2+r*.92+t*(w-r*1.84),r-3+(1-e)*3+R()*3,r,1]);}
  const tr=()=>{x.beginPath();for(const p of P){x.moveTo(p[0]+p[2],p[1]);x.arc(p[0],p[1],p[2],0,TAU);}rrect(x,-w/2+hh*.3,hh*.22,w-hh*.6,hh*.56,hh*.2);};
  if(!soft){
    x.save();x.shadowColor='rgba(40,70,130,.3)';x.shadowBlur=10*res;x.shadowOffsetY=8*res;x.fillStyle=pal[3];tr();x.fill();x.restore();
    x.save();x.translate(3,6);x.fillStyle=pal[3];tr();x.fill();x.restore();
    x.lineJoin='round';x.strokeStyle=hexA(pal[3],.6);x.lineWidth=3;tr();x.stroke();
  }
  const gr=x.createLinearGradient(0,-4,0,hh+4);gr.addColorStop(0,pal[0]);gr.addColorStop(.5,pal[1]);gr.addColorStop(1,pal[2]);
  x.fillStyle=gr;tr();x.fill();
  x.save();tr();x.clip();
  for(const p of P){const r=p[2],k=r*.72,lg=x.createLinearGradient(p[0]-k,p[1]-k,p[0]+k,p[1]+k);
    lg.addColorStop(0,'rgba(255,255,255,'+(soft?.5:.8)+')');lg.addColorStop(.45,'rgba(255,255,255,0)');lg.addColorStop(.6,hexA(pal[3],0));lg.addColorStop(1,hexA(pal[3],p[3]?.3:.42));
    x.fillStyle=lg;x.beginPath();x.arc(p[0],p[1],r,0,TAU);x.fill();}
  const bg=x.createLinearGradient(0,hh*.5,0,hh+6);bg.addColorStop(0,hexA(pal[3],0));bg.addColorStop(1,hexA(pal[3],.4));x.fillStyle=bg;x.fillRect(-w/2-20,hh*.5,w+40,hh);
  if(!soft){
    x.fillStyle='rgba(255,255,255,.3)';x.beginPath();x.ellipse(0,5,w*.4,5,0,0,TAU);x.fill();
    x.strokeStyle='rgba(255,255,255,.9)';x.lineWidth=2;x.lineCap='round';
    for(const p of P)if(p[3]){x.beginPath();x.arc(p[0],p[1],p[2]-2.4,PI*1.08,PI*1.7);x.stroke();}
    let b=P[m];for(const p of P)if(p[3]&&p[2]>b[2])b=p;
    x.fillStyle='rgba(255,255,255,.85)';x.beginPath();x.ellipse(b[0]-b[2]*.38,b[1]-b[2]*.42,b[2]*.2,b[2]*.11,-.6,0,TAU);x.fill();
  }
  x.restore();
  s={c:c,ox:pad+w/2,oy:pad,w:c.width/res,h:c.height/res,hh:hh};sprC.set(key,s);return s;
}
const hhOf=w=>clamp(Math.round(w*.4),40,58);
function pspr(type,w,v){w=Math.round(w);return cloudSpr(type,w,hhOf(w),PAL[type]||PAL.white,v||0,false);}

function moonSpr(){
  let s=sprC.get('moon');if(s)return s;
  const R=26,pad=10,res=SPR+1,sz=(R+pad)*2,t=mkc(sz*res,sz*res),x=t.getContext('2d');
  x.scale(res,res);x.translate(R+pad,R+pad);

  x.fillStyle=gr;x.beginPath();x.arc(0,0,R,0,TAU);x.fill();
  const ix=R*.5,iy=-R*.1,ir=R*.84;
  x.globalCompositeOperation='destination-out';x.beginPath();x.arc(ix,iy,ir,0,TAU);x.fill();
  x.globalCompositeOperation='source-atop';
  x.strokeStyle='rgba(200,110,0,.5)';x.lineWidth=5;x.beginPath();x.arc(ix,iy,ir+1.5,0,TAU);x.stroke();
  x.strokeStyle='rgba(255,255,255,.9)';x.lineWidth=2.4;x.lineCap='round';x.beginPath();x.arc(0,0,R-2.6,PI*.8,PI*1.42);x.stroke();
  x.fillStyle='rgba(225,140,20,.35)';x.beginPath();x.arc(-R*.62,R*.5,3.2,0,TAU);x.fill();x.beginPath();x.arc(-R*.78,-R*.4,2.2,0,TAU);x.fill();
  x.fillStyle='#5b3200';x.beginPath();x.ellipse(-R*.5,-R*.12,2.6,3.4,0,0,TAU);x.fill();
  x.fillStyle='#fff';x.beginPath();x.arc(-R*.5+.9,-R*.12-1.2,1,0,TAU);x.fill();
  x.fillStyle='rgba(255,120,120,.55)';x.beginPath();x.ellipse(-R*.68,R*.14,4,2.6,0,0,TAU);x.fill();
  x.strokeStyle='#5b3200';x.lineWidth=1.6;x.beginPath();x.arc(-R*.47,R*.1,3.6,.25,PI*.75);x.stroke();
  x.globalCompositeOperation='source-over';
  const c=mkc(sz*res,sz*res),y=c.getContext('2d');
  y.shadowColor='rgba(150,80,0,.9)';y.shadowBlur=1.6*res;y.drawImage(t,0,0);y.drawImage(t,0,0);
  s={c:c,o:R+pad,w:sz};sprC.set('moon',s);return s;
}

const BALC=[['#ff6a5e','#fff4e0'],['#5db4ff','#ffffff'],['#ffd23f','#ff8a3a'],['#b06cf5','#ffe3f4']];
function balSpr(i){
  const key='bal'+i;let s=sprC.get(key);if(s)return s;
  const c=mkc(120,180),x=c.getContext('2d');x.scale(2,2);
  x.strokeStyle='rgba(90,60,30,.6)';x.lineWidth=.8;x.beginPath();x.moveTo(14,50);x.lineTo(25,72);x.moveTo(46,50);x.lineTo(35,72);x.stroke();
  x.fillStyle='#8a5a2c';rrectFill(x,24,71,12,9,2);
  x.save();x.beginPath();x.ellipse(30,30,25,29,0,0,TAU);x.clip();
  for(let k=0;k<6;k++){x.fillStyle=BALC[i][k%2];x.fillRect(5+k*8.4,0,8.6,62);}
  const gr=x.createRadialGradient(20,18,2,30,30,32);gr.addColorStop(0,'rgba(255,255,255,.7)');gr.addColorStop(.5,'rgba(255,255,255,0)');gr.addColorStop(1,'rgba(40,30,80,.35)');x.fillStyle=gr;x.fillRect(0,0,60,62);
  x.restore();
  s={c:c};sprC.set(key,s);return s;
}

  const tot=C.reduce((a,c)=>a+c[0],0),target=Math.round(20*Math.pow(1.05,n-10)),seq=[['start'],['white',70,60]];let lastI=-1;

function build(n){
  const def=LV[n],pl=[];let cr=0,cy=0,id=0;
  const mk=(type,x,y,w,o)=>{id++;const q=Object.assign({type:type,x:x,y:y,w:w,x0:x,y0:y,px:x,py:y,solid:true,t:0,sx:1,sy:1,a:1,seed:n*131+id*17+3,st:0,u:0,cd:0,sq:0,fl:1+hash(id+n*9)*2,bolt:0,bseed:1,ang:0,shake:0,blink:false,dir:1,grp:0,k:0,used:false},o||{});pl.push(q);return q;};
  for(const s of def.seq){
    const type=s[0],o=s[4]||{};
    if(type==='start'){mk('start',0,0,DEFW.start);cr=DEFW.start/2;cy=0;continue;}
    const tt=type==='x'?o.t:type,w=s[3]||DEFW[tt]||130,left=cr+s[1],y=cy-s[2];
    switch(type){
      case 'x':mk(o.t,left+w/2,y,w,o.o);break;
      case 'blue':{const nn=o.n||4,stp=94,r=o.r||0;for(let i=0;i<nn;i++)mk('blue',left+42+i*stp,y-i*r,84,{i:i,n:nn,per:o.per||.55,hold:o.hold||1.3});cr=left+(nn-1)*stp+84;cy=y-(nn-1)*r;break;}
      case 'red':{const dx=o.dx||0,dy=o.dy||96;mk('red',left+w/2,y,w,{dx:dx,dy:dy,tiers:3});cr=left+w+2*dx;cy=y-2*dy;break;}
      case 'turq':{const tv=o.T||200;mk('turq',left+w/2,y,w,{T:tv,sp:o.sp||.9});cr=left+w;cy=y-tv;break;}
      case 'yellow':{const Lw=o.L||150;mk('yellow',left+Lw,y,64,{L:Lw,om:o.om||1.05,th:PI});cr=left+2*Lw;cy=y;break;}
      case 'purple':{const a=mk('purple',left+w/2,y,w),b=mk('purple',left+w/2+o.to[0],y-o.to[1],w);a.mate=b;b.mate=a;cr=b.x+w/2;cy=b.y;break;}
      case 'coral':mk('coral',left+w/2,y,w,{mx:o.to[0],my:-o.to[1]});cr=left+w+o.to[0];cy=y-o.to[1];break;
      case 'lilac':{const A=o.A||110;mk('lilac',left+w/2+A,y,w,{A:A,cx:left+w/2+A,len:o.len||260,sp:o.sp||1.5});cr=left+w+2*A;cy=y;break;}
      case 'mint':{const Hc=o.H||300;mk('mint',left+w/2,y+70,w,{H:Hc+70,solid:false});cr=left+w;cy=y-Hc+30;break;}
      case 'lime':{const Rr=o.R||90;mk('lime',left+w/2+Rr,y,w,{cx:left+w/2+Rr,R:Rr,sp:o.sp||1.1});cr=left+w+2*Rr;cy=y;break;}
      case 'indigo':{const r=o.r||90;mk('indigo',left+w/2,y,w,{ox:left+w/2+r,oy:y,r:r,sp:o.sp||1,ph:PI});cr=left+w+2*r;cy=y;break;}
      case 'sea':{const nn=o.n||5,stp=112;for(let i=0;i<nn;i++)mk('sea',left+42+i*stp,y,84,{i:i,A:o.A||40,sp:o.sp||1.8});cr=left+(nn-1)*stp+84;cy=y;break;}
      default:mk(type,left+w/2,y,w,o);cr=left+w;cy=y;
    }
  }
  const L={def:def,n:n,plats:pl,mints:pl.filter(q=>q.type==='mint'),fin:pl.find(q=>q.type==='finish')};
  let mxx=-1e9,mny=1e9,mxy=-1e9;for(const q of pl){mxx=Math.max(mxx,q.x);mny=Math.min(mny,q.y);mxy=Math.max(mxy,q.y);}
  L.right=mxx+300;L.top=mny-300;L.sea=mxy+400;
  const R=rng(n*7919+11);L.bg=[];
  for(const ly of [[.1,.5,1.7,3,560000],[.26,.7,1.25,6,430000],[.5,.9,.95,10,400000]]){
    const par=ly[0],x0=-900,x1=L.right*par+900,y0=L.top*par-750,y1=520,cnt=Math.ceil((x1-x0)*(y1-y0)/ly[4]),items=[];
    for(let i=0;i<cnt;i++){const w=[260,340,430,520][i%4];items.push({x:x0+R()*(x1-x0),y:y0+R()*(y1-y0),w:w,hh:Math.round(w*.34),v:i%2,s:ly[2]*(.75+.5*R()),dr:ly[3]*(.4+R())});}
    L.bg.push({par:par,alpha:ly[1],items:items});
  }
  L.bal=[];for(let i=0;i<4;i++)L.bal.push({x:-200+R()*(L.right*.2+700),y:L.top*.2-200+R()*(-L.top*.2+500),c:i,ph:R()*6});
  L.fg=[];const fx1=L.right*1.3+700,fy0=L.top*1.3-300,fc=Math.ceil((fx1+700)*(500-fy0)/620000);

  return L;
}

function tone(f0,f1,d,ty,v,dl){if(!AC)return;try{const t=AC.currentTime+(dl||0),o=AC.createOscillator(),ga=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);ga.gain.setValueAtTime(v,t);ga.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(ga);ga.connect(AC.destination);o.start(t);o.stop(t+d+.03);}catch(e){}}
function sfx(n){
  if(n==='jump')tone(420,780,.13,'triangle',.1);
  else if(n==='boing')tone(200,920,.24,'sine',.16);
  else if(n==='hurt')tone(320,70,.3,'sawtooth',.12);
  else if(n==='pop')tone(760,120,.09,'square',.06);
  else if(n==='gold'){tone(880,1320,.12,'triangle',.11);tone(1320,1980,.2,'triangle',.11,.1);}
  else if(n==='tp')tone(1300,300,.26,'sine',.11);
  else if(n==='win'){[523,659,784,1046].forEach((f,i)=>tone(f,f*1.01,.22,'triangle',.12,i*.12));}
}

function topAt(q,x){
  if(!q.solid)return null;
  if(q.type==='yellow'){
    let best=null;if(Math.abs(x-q.x)<=34)best=q.y;
    for(const a of [q.th,q.th+PI]){
      const c=Math.cos(a),s=Math.sin(a),dx=q.L*c,x1=q.x+dx,lo=Math.min(q.x,x1)-10,hi=Math.max(q.x,x1)+10;
      if(x<lo||x>hi)continue;
      const yy=Math.abs(c)>.12?q.y+clamp(x-q.x,Math.min(0,dx),Math.max(0,dx))*(s/c):Math.min(q.y,q.y+q.L*s);
      if(best==null||yy<best)best=yy;
    }
    return best;
  }
  return Math.abs(x-q.x)<=q.w*q.sx/2+12?q.y:null;
}
function updPlat(q,dt){
  q.px=q.x;q.py=q.y;q.t+=dt;const stood=pl.ground===q;
  switch(q.type){
    case 'turq':{const ph=(q.t*q.sp*.5)%2,u=ph<1?ph:2-ph;q.y=q.y0-q.T*u*u*(3-2*u);break;}
    case 'green':{const c=q.t%4.9;if(c<3.7){const u=c/3.7;q.solid=true;q.sx=q.sy=.6+.85*u;q.y=q.y0-18*u;q.a=Math.min(1,c*4);q.shake=u>.8?(u-.8)*5:0;q.st=0;}else{if(q.st===0){q.st=1;burst(q.x,q.y+20,'#8fe87a',14);if(Math.abs(q.x-pl.x)<500)sfx('pop');}q.solid=false;q.a=0;}break;}
    case 'blue':{const end=q.n*q.per+q.hold,c=q.t%(end+.7),on=c>=q.i*q.per&&c<end;q.solid=on;q.a=on?1:0;q.sx=q.sy=on?Math.min(1,.4+(c-q.i*q.per)*6):1;q.blink=on&&c>end-.45;break;}
    case 'red':{const per=1.45,vis=1.25,c=q.t%(per*q.tiers),k=Math.floor(c/per),u=c-k*per;q.k=k;q.x=q.x0+k*q.dx;q.y=q.y0-k*q.dy;q.solid=u<vis;q.a=q.solid?1:0;q.blink=q.solid&&u>vis-.4;q.sx=q.sy=q.solid?Math.min(1,.5+u*8):1;break;}
    case 'orange':{const c=q.t%3.4;let a=0;if(c<2){a=0;q.shake=c>1.5?1:0;}else if(c<2.2){a=(c-2)/.2;q.shake=0;}else if(c<3.1)a=1;else a=1-(c-3.1)/.3;q.ang=a*1.15;q.solid=c<2.03||c>3.33;break;}
    case 'yellow':q.th=(q.th+q.om*dt)%TAU;break;
    case 'pink':{if(q.st===1){if(q.t>.85){q.st=2;q.t=0;q.solid=false;q.a=0;burst(q.x,q.y+14,'#ffb3d9',10);}else{const u=q.t/.85;q.sy=1-.5*u;q.a=1-.55*u;}}else if(q.st===2){if(q.t>2.2){q.st=0;q.t=0;q.solid=true;}}else{q.a=Math.min(1,q.a+dt*3);q.sy=Math.min(1,q.sy+dt*3);}break;}
    case 'lilac':{const am=Math.asin(Math.min(.95,q.A/q.len)),a=am*Math.sin(q.t*q.sp);q.ang=a;q.x=q.cx+q.len*Math.sin(a);q.y=q.y0-q.len*(1-Math.cos(a));break;}
    case 'beige':q.y=stood?Math.min(q.y0+90,q.y+70*dt):Math.max(q.y0,q.y-55*dt);break;
    case 'coral':{const d=Math.hypot(q.mx,q.my)||1;
      if(q.st===0){if(stood){q.st=1;q.t=0;}}
      else if(q.st===1){if(q.t>.35)q.st=2;}
      else if(q.st===2){q.u=Math.min(1,q.u+230*dt/d);if(q.u>=1){q.st=3;q.t=0;}}
      else if(q.st===3){if(q.t>(stood?1.4:.6))q.st=4;}
      else{q.u=Math.max(0,q.u-300*dt/d);if(q.u<=0)q.st=0;}
      q.x=q.x0+q.mx*q.u;q.y=q.y0+q.my*q.u;break;}
    case 'purple':q.cd=Math.max(0,q.cd-dt);break;
    case 'navy':q.solid=q.grp===navy;q.a+=((q.solid?1:.2)-q.a)*Math.min(1,dt*14);break;
    case 'black':q.fl-=dt;if(q.fl<=0){q.fl=1.6+Math.random()*2.4;q.bolt=.24;q.bseed=(Math.random()*1e6)|0;}q.bolt=Math.max(0,q.bolt-dt);break;
    case 'brown':q.sq=Math.max(0,q.sq-dt*3);break;
    case 'lime':q.x=q.cx+q.R*Math.sin(q.t*q.sp);break;
    case 'indigo':{const an=q.ph+q.t*q.sp;q.x=q.ox+q.r*Math.cos(an);q.y=q.oy+q.r*Math.sin(an);break;}
    case 'sea':q.y=q.y0+q.A*Math.sin(q.t*q.sp-q.i*.9);break;
    case 'magenta':{if(stood)q.sx=Math.max(0,q.sx-.5*dt);else q.sx=Math.min(1,q.sx+.45*dt);
      if(q.solid&&q.sx<.15){q.solid=false;burst(q.x,q.y+16,'#ff8be6',10);if(Math.abs(q.x-pl.x)<500)sfx('pop');}else if(!q.solid&&q.sx>.4)q.solid=true;
      q.sy=.55+.45*q.sx;q.a=q.solid?1:.35;break;}
    case 'peach':{if(q.st===1){q.shake=1;if(q.t>.5){q.st=2;q.t=0;q.vy=0;q.shake=0;}}

      else if(q.st===3){if(q.t>2){q.st=0;q.y=q.y0;q.solid=true;q.a=0;}}
      else{q.a=Math.min(1,q.a+dt*3);q.shake=0;}break;}
  }
}

function land(q,top){
  const p=pl;

  if(q.type==='brown'){p.y=top-2;p.vy=-1020;q.sq=1;p.sq=.35;sfx('boing');puff(p.x,top,5);return;}
  if(q.type==='purple'&&q.cd<=0&&q.mate){const m=q.mate;burst(p.x,p.y-20,'#c79bff',14,1);p.x=m.x;p.y=m.y-3;p.vx=0;p.vy=-330;q.cd=m.cd=1.3;burst(m.x,m.y-20,'#c79bff',14,1);sfx('tp');return;}

}
function stepPlayer(dt){
  const p=pl,ctl=state==='play';
  const ax=ctl?((inp.r?1:0)-(inp.l?1:0)):0,q0=p.ground,ice=q0&&q0.type==='ice';
  const acc=ice?380:(q0?2600:2000),fr=ice?110:(q0?2400:500);
  if(ax){p.vx+=ax*acc*dt;p.face=ax;}else if(p.vx){const s=Math.sign(p.vx);p.vx-=s*fr*dt;if(Math.sign(p.vx)!==s)p.vx=0;}
  p.vx=clamp(p.vx,-RUN,RUN);
  p.buf-=dt;p.coy-=dt;p.inv=Math.max(0,p.inv-dt);p.sq+=(0-p.sq)*Math.min(1,dt*9);
  if(ctl&&inp.jp)p.buf=.13;inp.jp=false;
  if(p.ground){p.coy=.1;p.lg=p.ground;}
  if(p.buf>0&&p.coy>0){const sup=p.lg&&p.lg.type==='rose';p.vy=-JUMP*(sup?1.45:1);if(sup){burst(p.x,p.y,'#ff8fa3',12,1);sfx('boing');}p.ground=null;p.buf=0;p.coy=0;p.sq=.3;navy^=1;sfx('jump');puff(p.x,p.y,3);}
  if(p.ground){
    const q=p.ground,dx=q.x-q.px;
    if(Math.abs(dx)<30)p.x+=dx;
    if(q.type==='grey')p.x+=q.dir*130*dt;
    p.x+=p.vx*dt;
    if(q.type==='yellow'&&Math.abs(p.x-q.x)>34){const dx=p.x-q.x;for(const a of [q.th,q.th+PI]){const c=Math.cos(a);if(c*dx>0&&Math.abs(c)>.12){p.x+=clamp(Math.sin(a)/c,-2,2)*170*dt;break;}}}
    const top=topAt(q,p.x);
    if(top==null){p.ground=null;p.vy=0;}else{p.y=top;p.vy=0;}
  }else{
    for(const m of L.mints){if(Math.abs(p.x-m.x)<m.w/2&&p.y>m.y-m.H&&p.y<m.y+70){if(p.vy>-400)p.vy-=(G+1500)*dt;else p.vy-=G*dt;}}
    p.vy=Math.min(1500,p.vy+G*dt);
    const y0=p.y;p.x+=p.vx*dt;p.y+=p.vy*dt;
    for(const q of L.plats){
      if(!q.solid||Math.abs(q.x-p.x)>q.w+260)continue;
      const top=topAt(q,p.x);if(top==null)continue;
      let dy=q.y-q.py;if(Math.abs(dy)>30)dy=0;
      if(p.vy-dy/dt<0)continue;
      if(y0-(top-dy)<=(q.type==='yellow'?20:7)&&p.y>=top){land(q,top);break;}
    }
  }
  if(ctl&&p.ground&&p.ground.type==='finish'&&p.x>p.ground.x+6){const q=p.ground;state='climb';cl={rx:q.x-20,ry:q.y+85,s:p.x-(q.x-20),t:0};p.ground=null;p.vx=p.vy=0;p.face=1;sfx('win');}
  if(p.y>L.sea+50)fellInSea();
}

  if(k==='ArrowLeft'||k==='a'||k==='A'){start();key.l=true;}
  else if(k==='ArrowRight'||k==='d'||k==='D'){start();key.r=true;}
  else if(k===' '||k==='ArrowUp'||k==='w'||k==='W'){if(!e.repeat&&!start())inp.jp=true;}
  else if(k==='Enter'&&state==='over'){state='adwait';REKLAM.odul(function(ok){if(ok)revive();else state='over';});}
  else return;
  e.preventDefault();
});
window.addEventListener('keyup',function(e){const k=e.key;if(k==='ArrowLeft'||k==='a'||k==='A')key.l=false;else if(k==='ArrowRight'||k==='d'||k==='D')key.r=false;});
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();
  const uc=U/DPR;
  if(!REKLAM.yerli&&Math.hypot(e.clientX-(W/DPR-30*uc),e.clientY-72*uc)<26*uc){toggleFS();return;}
  if(state==='load'||state==='adwait')return;
  if(state==='title'&&inBox(e,langBox())){setLang(LANG==='tr'?'en':'tr');return;}
  if(state==='over'){const b=overBtns();
    if(inBox(e,b.a)){state='adwait';odulMsg='';REKLAM.odul(function(ok){if(ok)revive();else{state='over';odulMsg=ok===null?tx('adNotReady'):tx('adCut');}});}
    else if(inBox(e,b.r)){odulMsg='';restartAll();}
    return;}
  if(!REKLAM.yerli&&Math.hypot(e.clientX-56*uc,e.clientY-56*uc)<46*uc){start();if(fade.dir===0&&state!=='title'){const keep=state;fadeOut(function(){loadLevel((cur+1)%LV.length,lives);state=keep==='end'?'title':keep==='climb'?'play':keep;});}return;}
  if(start())return;
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
  const jump=e.clientX>=lay().jx;pts.set(e.pointerId,{x:e.clientX,jump:jump});if(jump)inp.jp=true;
});
cv.addEventListener('pointermove',function(e){const p=pts.get(e.pointerId);if(p)p.x=e.clientX;});
function pup(e){pts.delete(e.pointerId);}
cv.addEventListener('pointerup',pup);cv.addEventListener('pointercancel',pup);
cv.addEventListener('contextmenu',function(e){e.preventDefault();});
window.addEventListener('blur',function(){pts.clear();key.l=key.r=false;});
window.addEventListener('resize',resize);

/* ---------- döngü ---------- */
let last=0,accT=0;
function frame(ts){
  const dt=Math.min(.05,Math.max(0,(ts-last)/1000||0));last=ts;
  const split=lay().split;let l=key.l,r=key.r;pts.forEach(p=>{if(!p.jump){if(p.x<split)l=true;else r=true;}});inp.l=l;inp.r=r;
  accT+=dt;let n=0;while(accT>=STEP&&n<8){step(STEP);accT-=STEP;n++;}if(n===8)accT=0;
  render(dt);
  requestAnimationFrame(frame);
}
resize();
let sv=0,sl=3;try{sv=parseInt(localStorage.getItem('hilalLvl')||'0',10)||0;sl=parseFloat(localStorage.getItem('hilalCan')||'3')||3;}catch(e){}
loadLevel(clamp(sv,0,LV.length-1),clamp(sl,.5,5));
REKLAM.basla(function(h){ADH=h;resize();});
requestAnimationFrame(frame);
})();
</script>
